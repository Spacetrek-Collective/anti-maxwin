# SearXNG untuk worker discover (internal, tidak dibuka ke internet).
# Dokumentasi: https://docs.searxng.org/admin/settings/index.html
use_default_settings: true

general:
  instance_name: "anti-maxwin-search"
  debug: false

server:
  # Diganti lewat env SEARXNG_SECRET (lihat .env). Nilai ini hanya placeholder.
  secret_key: "ganti-lewat-env-SEARXNG_SECRET"
  limiter: false        # dipakai internal oleh worker, tidak perlu rate limiter / valkey
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0        # 0 = tanpa filter; safe search bisa menyembunyikan hasil judol
  default_lang: "id-ID"
  formats:
    - html
    - json              # WAJIB: worker memakai format=json
  # Engine yang kena captcha/rate limit dinonaktifkan sementara (bukan ditembus).
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 7200
    SearxEngineTooManyRequests: 3600

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 20
  pool_maxsize: 10

# Engine web umum yang mendukung operator dork (site:, inurl:, "frasa").
# Engine lain dari default tetap ada; worker bisa memilih lewat env SEARXNG_ENGINES.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
